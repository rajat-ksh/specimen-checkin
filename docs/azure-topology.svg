<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="740" viewBox="0 0 1480 740">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .box { rx: 16; ry: 16; stroke-width: 2; }
      .title { font: 700 18px Arial, sans-serif; fill: #172033; }
      .sub { font: 14px Arial, sans-serif; fill: #475569; }
      .label { font: 13px Arial, sans-serif; fill: #64748b; }
      .edge { stroke:#64748b; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
      .dashed { stroke-dasharray:7 6; }
    </style>
  </defs>

  <text x="50" y="46" class="title" font-size="26">Azure topology — Specimen Check-In</text>
  <text x="50" y="72" class="sub">Local implementation maps cleanly to Azure services; Redis is used as a cache-aside layer for faster manifest reads.</text>

  <rect class="box" x="55" y="255" width="175" height="76" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="78" y="285" class="title">🌐 Browser</text><text x="78" y="310" class="sub">Vue 3 client</text>

  <rect class="box" x="300" y="255" width="220" height="76" fill="#fff2cc" stroke="#d6b656"/>
  <text x="324" y="285" class="title">🛡️ Azure Front Door</text><text x="324" y="310" class="sub">TLS, routing, WAF</text>

  <rect class="box" x="615" y="120" width="240" height="76" fill="#d5e8d4" stroke="#82b366"/>
  <text x="638" y="150" class="title">🖥️ Static Web Apps</text><text x="638" y="175" class="sub">Vue frontend</text>

  <rect class="box" x="615" y="255" width="240" height="76" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="638" y="285" class="title">⚙️ Azure App Service</text><text x="638" y="310" class="sub">ASP.NET Core API</text>

  <rect class="box" x="980" y="180" width="250" height="76" fill="#f8cecc" stroke="#b85450"/>
  <text x="1004" y="210" class="title">⚡ Azure Cache for Redis</text><text x="1004" y="235" class="sub">Manifest read cache</text>

  <rect class="box" x="980" y="310" width="250" height="76" fill="#d5e8d4" stroke="#82b366"/>
  <text x="1004" y="340" class="title">🗄️ Azure SQL Database</text><text x="1004" y="365" class="sub">Tenant-scoped source of truth</text>

  <rect class="box" x="615" y="455" width="240" height="76" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="638" y="485" class="title">📨 Storage Queue</text><text x="638" y="510" class="sub">Reconciliation jobs</text>

  <rect class="box" x="980" y="455" width="250" height="76" fill="#fff2cc" stroke="#d6b656"/>
  <text x="1004" y="485" class="title">🔁 Azure Function</text><text x="1004" y="510" class="sub">Summary worker</text>

  <rect class="box" x="1280" y="455" width="170" height="76" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="1304" y="485" class="title">📦 Blob Storage</text><text x="1304" y="510" class="sub">Summary artifacts</text>

  <rect class="box" x="615" y="610" width="240" height="76" fill="#f5f5f5" stroke="#666"/>
  <text x="638" y="640" class="title">📈 Application Insights</text><text x="638" y="665" class="sub">PHI-safe telemetry</text>

  <rect class="box" x="980" y="610" width="250" height="76" fill="#f5f5f5" stroke="#666"/>
  <text x="1004" y="640" class="title">🔐 Azure Key Vault</text><text x="1004" y="665" class="sub">Secrets and connection strings</text>

  <path class="edge" d="M230 293 H300"/><path class="edge" d="M520 293 H615"/>
  <path class="edge" d="M520 280 C565 280 565 158 615 158"/>
  <path class="edge" d="M855 285 C905 285 905 218 980 218"/>
  <path class="edge" d="M855 305 C905 305 905 348 980 348"/>
  <path class="edge" d="M735 331 V455"/>
  <path class="edge" d="M855 493 H980"/>
  <path class="edge" d="M1230 493 H1280"/>
  <path class="edge dashed" d="M735 331 V610"/>
  <path class="edge dashed" d="M855 648 H980"/>

  <text x="536" y="271" class="label">API requests</text>
  <text x="536" y="152" class="label">Static assets</text>
  <text x="871" y="206" class="label">Cache-aside</text>
  <text x="890" y="340" class="label">EF Core</text>
  <text x="746" y="402" class="label">On close</text>
</svg>
